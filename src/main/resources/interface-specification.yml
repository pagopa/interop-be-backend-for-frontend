components:
  parameters:
    CorrelationIdHeader:
      in: header
      name: X-Correlation-Id
      required: true
      schema:
        type: string
    IpAddress:
      in: header
      name: X-Forwarded-For
      schema:
        type: string
  schemas:
    Mail:
      type: object
      required:
        - address
      properties:
        address:
          type: string
        description:
          type: string
    CatalogEServiceDescriptor:
      type: object
      required:
        - eservice
        - id
        - version
        - docs
        - state
        - audience
        - voucherLifespan
        - dailyCallsPerConsumer
        - dailyCallsTotal
        - agreementApprovalPolicy
        - hasCertifiedAttributes
        - isSubscribed
        - isMine
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        description:
          type: string
        interface:
          $ref: '#/components/schemas/EServiceDoc'
        docs:
          type: array
          items:
            $ref: '#/components/schemas/EServiceDoc'
        state:
          $ref: '#/components/schemas/EServiceDescriptorState'
        audience:
          type: array
          items:
            type: string
        voucherLifespan:
          type: integer
          format: int32
        dailyCallsPerConsumer:
          description: 'maximum number of daily calls that this descriptor can afford.'
          type: integer
          format: int32
          minimum: 0
        dailyCallsTotal:
          description: 'total daily calls available for this e-service.'
          type: integer
          format: int32
          minimum: 0
        agreementApprovalPolicy:
          $ref: '#/components/schemas/AgreementApprovalPolicy'
        eservice:
          $ref: '#/components/schemas/CatalogDescriptorEService'
    CatalogDescriptorEService:
      type: object
      required:
        - id
        - name
        - description
        - technology
        - attributes
        - descriptors
        - isMine
        - hasCertifiedAttributes
        - isSubscribed
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        technology:
          $ref: '#/components/schemas/EServiceTechnology'
        attributes:
          $ref: '#/components/schemas/EServiceAttributes'
        descriptors:
          type: array
          items:
            $ref: '#/components/schemas/CompactDescriptor'
        agreement:
          $ref: '#/components/schemas/CompactAgreement'
        isMine:
          type: boolean
        hasCertifiedAttributes:
          type: boolean
        isSubscribed:
