components:
  parameters:
    CorrelationIdHeader:
      in: header
      name: X-Correlation-Id
      required: true
      schema:
        type: string
    IpAddress:
      in: header
      name: X-Forwarded-For
      schema:
        type: string
  schemas:
    Agreement:
      properties:
        id:
          type: string
          format: uuid
        descriptorId:
          type: string
          format: uuid
        producer:
          $ref: '#/components/schemas/Tenant'
        consumer:
          $ref: '#/components/schemas/TenantWithAttributes'
        eservice:
          $ref: '#/components/schemas/EService'
        state:
          $ref: '#/components/schemas/AgreementState'
        verifiedAttributes:
          type: array
          description: 'set of the verified attributes belonging to this agreement, if any.'
          items:
            $ref: '#/components/schemas/VerifiedAttribute'
        certifiedAttributes:
          type: array
          description: 'set of the certified attributes belonging to this agreement, if any.'
          items:
            $ref: '#/components/schemas/CertifiedAttribute'
        declaredAttributes:
          type: array
          description: 'set of the declared attributes belonging to this agreement, if any.'
          items:
            $ref: '#/components/schemas/DeclaredAttribute'
        suspendedByConsumer:
          type: boolean
        suspendedByProducer:
          type: boolean
        suspendedByPlatform:
          type: boolean
        consumerNotes:
          type: string
        rejectionReason:
          type: string
        consumerDocuments:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
        - id
        - producer
        - consumer
        - descriptorId
        - eservice
        - attributes
        - state
        - verifiedAttributes
        - certifiedAttributes
        - declaredAttributes
        - consumerDocuments
        - createdAt
    Agreements:
      type: array
      items:
        $ref: '#/components/schemas/Agreement'
    AgreementPayload:
      type: object
      description: contains the information for agreement creation.
      properties:
        eserviceId:
          type: string
          format: uuid
        descriptorId:
          type: string
          format: uuid
      required:
        - eserviceId
        - descriptorId
    AgreementSubmissionPayload:
      type: object
      description: contains the information for agreement creation.
      properties:
        consumerNotes:
          type: string
    AgreementRejectionPayload:
      type: object
      description: contains the information for agreement rejection.
      properties:
        reason:
          type: string
      required:
        - reason
    CatalogEServices:
      type: object
      properties:
        eservices:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEService'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - eservices
        - pagination
    CatalogEService:
      type: object
      required:
        - id
        - name
        - description
        - producer
        - isMine
        - canSubscribe
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        producer:
